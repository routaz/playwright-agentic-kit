name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # check-leaks reads the full commit history

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Typecheck, format and validate context
        run: npm run typecheck && npm run format:check && npm run context:check

      - name: Check for leaked private names
        run: npm run check:leaks
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}

      - name: E2E tests
        run: npm test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
